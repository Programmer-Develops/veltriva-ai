services:
  - type: web
    name: veltriva-ai-paypal-treasury
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PAYPAL_MODE
        value: sandbox
      - key: DATABASE_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
